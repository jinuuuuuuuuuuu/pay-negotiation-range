name: Deploy app to GitHub Pages

# 4_MVP 폴더(정적 웹앱)만 웹에 올린다. main에 올리면 1~2분 뒤 주소가 바뀐다.
on:
  push:
    branches: [main]
    paths:
      - "4_MVP/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Calculation parity test (JS engine vs. formula.py golden values)
        working-directory: 4_MVP
        run: node tests/parity.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 4_MVP
      - id: deployment
        uses: actions/deploy-pages@v4
